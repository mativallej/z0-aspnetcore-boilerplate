name: z0-aspnetcore-boilerplate

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: z0-aspnetcore-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=z0db;Username=postgres;Password=postgres
      - AWS__Cognito__Region=us-east-1
      - AWS__Cognito__UserPoolId=us-east-1_XXXXXXXXX
      - AWS__Cognito__AppClientId=xxxxxxxxxxxxxxxxxxxxxxxxxx
      - AWS__Cognito__Authority=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - z0-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: z0-aspnetcore-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=z0db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - z0-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d z0db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: z0-aspnetcore-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@z0.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - z0-network
    restart: unless-stopped
    profiles:
      - tools

networks:
  z0-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
